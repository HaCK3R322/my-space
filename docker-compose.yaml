version: '3.8'

services:
  # PostgreSQL 15 Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: local-postgres-15
    environment:
      POSTGRES_DB: tasks-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
