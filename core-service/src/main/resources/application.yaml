server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_ADDRESS:jdbc:postgresql://localhost:5432/tasks-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:local_password}
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG

